<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Lyrical themes</title>
</head>
<body class="lyrical-page">
  <nav id="site-nav" class="site-nav" aria-label="Site"></nav>

  <header class="lyrical-page__hero">
    <h1>Evolution of the lyrical themes</h1>
    <p>We used principal component analysis on the emotions, in order to extract four main lyrical themes.</p>
    <p>Each dot is a line of lyrics, colored by theme.</p>
  </header>

  <main class="lyrical-page__main">
    <nav id="album-timeline" class="lyrical-album-timeline" aria-label="Album timeline"></nav>
    <div id="theme-legend" class="theme-legend" aria-label="Theme legend"></div>
    <div class="lyrical-page__panel lyrical-graph-wrap">
      <div class="graph" id="dot-grid">
        <svg class="dot-grid-svg"></svg>
      </div>
    </div>
  </main>

  <div id="tooltip" class="tooltip"></div>

  <script type="module" src="/src/lyrical-themes/main.js"></script>
</body>
</html>
